name: CI

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify-momotodo:
    name: Verify MomoTodo
    runs-on: windows-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Node.js and pnpm
        uses: sena-nana/LiliaUI/.github/actions/setup-node-pnpm@aa0c1df985de80420764ca5d952afa29f47c4ea8

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            apps/desktop/src-tauri/target
          key: ${{ runner.os }}-cargo-${{ hashFiles('apps/desktop/src-tauri/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Verify MomoTodo
        run: pnpm verify

  build-docs:
    name: Build docs
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Node.js and pnpm
        uses: sena-nana/LiliaUI/.github/actions/setup-node-pnpm@aa0c1df985de80420764ca5d952afa29f47c4ea8

      - name: Build docs
        run: pnpm docs:build
